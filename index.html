<!DOCTYPE html>
<html>
<head>
  <title>Habit Tracker</title>
  <style>
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      margin: 0;
    }

    h1 {
      color: #222;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #habitInput {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      width: 220px;
    }

    #addBtn {
      padding: 10px 16px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    #addBtn:hover {
      background: #3a7bc8;
    }

    #habitList {
      list-style: none;
      padding: 0;
      width: 100%;
      max-width: 360px;
    }

    #habitList li {
      background: white;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 15px;
    }

    #habitList button {
      padding: 6px 12px;
      border: none;
      background: #ff9f43;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    #habitList button:hover {
      background: #e68a2e;
    }
  </style>
</head>
<body>
  <h1>🔥 My Habit Tracker</h1>

  <div class="input-row">
    <input type="text" id="habitInput" placeholder="Enter a habit">
    <button id="addBtn">Add Habit</button>
  </div>

  <ul id="habitList"></ul>

  <script>
    let habits = JSON.parse(localStorage.getItem("habits")) || [];

    document.getElementById("addBtn").addEventListener("click", function() {
      const input = document.getElementById("habitInput");
      const habitName = input.value.trim();

      if (habitName !== "") {
        habits.push({ name: habitName, streak: 0 });
        input.value = "";
        saveAndRender();
      }
    });

    function saveAndRender() {
      localStorage.setItem("habits", JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const list = document.getElementById("habitList");
      list.innerHTML = "";

      habits.forEach(function(habit) {
        const li = document.createElement("li");

        const text = document.createElement("span");
        text.textContent = habit.name + " — 🔥 " + habit.streak;

        const doneBtn = document.createElement("button");
        doneBtn.textContent = "Done today";
        doneBtn.addEventListener("click", function() {
          habit.streak++;
          saveAndRender();
        });

        li.appendChild(text);
        li.appendChild(doneBtn);
        list.appendChild(li);
      });
    }

    renderHabits();
  </script>
</body>
</html>

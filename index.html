<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080812;
      --fg: #f0eeff;
      --card: #12121e;
      --card-fg: #e8e4ff;
      --primary: #7c3aed;
      --primary-fg: #ffffff;
      --secondary: #1e1a2e;
      --secondary-fg: #c4b8ff;
      --muted: #1a1826;
      --muted-fg: #6b6488;
      --accent: #a3e635;
      --accent-fg: #0a1200;
      --border: rgba(124,58,237,0.18);
      --radius: 1rem;
      --font-display: 'Bricolage Grotesque', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    html, body, #root {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { display: none; }

    @keyframes burst {
      0%   { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx),var(--dy)) scale(0); opacity: 0; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }
    .slide-up { animation: slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
    .fade-in  { animation: fadeIn 0.25s ease-out; }

    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    textarea, input {
      font-family: var(--font-body);
      color: var(--fg);
      background: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
    }
    textarea:focus, input:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MOODS = [
      { label: 'Awful', emoji: '😞', value: 1 },
      { label: 'Bad',   emoji: '😕', value: 2 },
      { label: 'Okay',  emoji: '😐', value: 3 },
      { label: 'Good',  emoji: '🙂', value: 4 },
      { label: 'Great', emoji: '😄', value: 5 },
    ];

    const BADGE_DEFS = [
      { id: 'first',   name: 'First Step',    desc: 'Complete your first habit',    icon: '🚀', earned: true  },
      { id: 'week',    name: 'Week Warrior',   desc: '7-day streak on any habit',    icon: '🔥', earned: true  },
      { id: 'perfect', name: 'Perfect Day',    desc: 'Complete all habits in a day', icon: '⭐', earned: false },
      { id: 'month',   name: 'Month Master',   desc: '30-day streak',                icon: '👑', earned: false },
      { id: 'journal', name: 'Soul Searcher',  desc: 'Log 10 journal entries',       icon: '📓', earned: false },
      { id: 'early',   name: 'Early Bird',     desc: '5 habits before 9 AM',         icon: '🌅', earned: false },
    ];

    const SAMPLE_HABITS = [
      { id:'1', name:'Morning Meditation', icon:'🧘', color:'#7c3aed', streak:12, completedToday:false, frequency:'Daily', xpPerCompletion:15 },
      { id:'2', name:'Exercise',           icon:'💪', color:'#a3e635', streak:8,  completedToday:false, frequency:'Daily', xpPerCompletion:20 },
      { id:'3', name:'Read 30 Min',        icon:'📚', color:'#f59e0b', streak:5,  completedToday:false, frequency:'Daily', xpPerCompletion:10 },
      { id:'4', name:'Cold Shower',        icon:'🚿', color:'#06b6d4', streak:3,  completedToday:false, frequency:'Daily', xpPerCompletion:12 },
      { id:'5', name:'No Sugar',           icon:'🍎', color:'#ef4444', streak:15, completedToday:false, frequency:'Daily', xpPerCompletion:18 },
    ];

    const ICONS  = ['⚡','🧘','💪','📚','🚿','🍎','✍️','🏃','💧','🎯','🌿','🎵'];
    const COLORS = ['#7c3aed','#a3e635','#f59e0b','#06b6d4','#ef4444','#ec4899','#8b5cf6','#10b981'];

    const today    = new Date();
    const todayStr = today.toISOString().split('T')[0];

    function getWeekDates() {
      return Array.from({ length: 7 }, (_, i) => {
        const d = new Date(today);
        d.setDate(d.getDate() - 3 + i);
        return d;
      });
    }

    function getLast30Days() {
      return Array.from({ length: 30 }, (_, i) => {
        const d = new Date(today);
        d.setDate(d.getDate() - 29 + i);
        return d;
      });
    }

    /* ── Celebration burst ── */
    function CelebrationBurst({ x, y }) {
      const particles = Array.from({ length: 12 }, (_, i) => {
        const angle = (i * 30 * Math.PI) / 180;
        const dist  = 60 + Math.random() * 40;
        return { dx: Math.cos(angle)*dist, dy: Math.sin(angle)*dist,
          color: ['#a3e635','#7c3aed','#f59e0b','#ec4899'][i%4] };
      });
      return (
        <div style={{ position:'fixed', left:x, top:y, pointerEvents:'none', zIndex:50 }}>
          {particles.map((p,i) => (
            <div key={i} style={{
              position:'absolute', width:8, height:8, borderRadius:'50%',
              backgroundColor: p.color,
              animation: 'burst 0.6s ease-out forwards',
              '--dx': p.dx+'px', '--dy': p.dy+'px',
            }} />
          ))}
        </div>
      );
    }

    /* ── XP Bar ── */
    function XPBar({ xp, level, maxXP }) {
      const pct = Math.min((xp/maxXP)*100, 100);
      return (
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ flex:1, height:8, borderRadius:99, background:'#1e1a2e', overflow:'hidden' }}>
            <div style={{
              height:'100%', borderRadius:99,
              background:'linear-gradient(90deg,#7c3aed,#a3e635)',
              width:`${pct}%`, transition:'width 0.7s ease'
            }} />
          </div>
          <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'#a3e635' }}>Lv.{level}</span>
        </div>
      );
    }

    /* ── Habit Card ── */
    function HabitCard({ habit, onToggle }) {
      const [hover, setHover] = useState(false);
      return (
        <div
          onClick={(e) => onToggle(habit.id, e)}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          style={{
            display:'flex', alignItems:'center', gap:16,
            padding:16, borderRadius:20,
            border: `1.5px solid ${habit.completedToday ? 'rgba(163,230,53,0.3)' : hover ? 'rgba(124,58,237,0.5)' : 'var(--border)'}`,
            background: habit.completedToday ? '#0d1a00' : hover ? '#16122a' : 'var(--card)',
            cursor:'pointer', userSelect:'none', transition:'all 0.25s',
          }}
        >
          <div style={{
            width:48, height:48, borderRadius:14, fontSize:24,
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
            backgroundColor: habit.color+'22',
            border: `1.5px solid ${habit.color}44`,
            transform: hover ? 'scale(1.08)' : 'scale(1)', transition:'transform 0.2s',
          }}>{habit.icon}</div>

          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{
                fontFamily:'var(--font-display)', fontWeight:600, fontSize:15,
                textDecoration: habit.completedToday ? 'line-through' : 'none',
                opacity: habit.completedToday ? 0.5 : 1,
              }}>{habit.name}</span>
              {habit.completedToday && (
                <span style={{ fontSize:11, fontWeight:700, padding:'2px 8px', borderRadius:99, background:'rgba(163,230,53,0.12)', color:'#a3e635' }}>Done</span>
              )}
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:12, marginTop:4 }}>
              <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>{habit.frequency}</span>
              {habit.streak > 0 && (
                <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'#f59e0b' }}>🔥 {habit.streak}d</span>
              )}
            </div>
          </div>

          <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
            <div style={{
              width:28, height:28, borderRadius:'50%', flexShrink:0,
              display:'flex', alignItems:'center', justifyContent:'center',
              border: `2px solid ${habit.completedToday ? '#a3e635' : hover ? 'var(--primary)' : 'var(--border)'}`,
              background: habit.completedToday ? '#a3e635' : 'transparent',
              transition:'all 0.25s',
            }}>
              {habit.completedToday && (
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                  <path d="M2 6l3 3 5-5" stroke="#0a1200" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </div>
            <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>+{habit.xpPerCompletion}xp</span>
          </div>
        </div>
      );
    }

    /* ── Stat Card ── */
    function StatCard({ label, value, sub, color }) {
      return (
        <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)', display:'flex', flexDirection:'column', gap:4 }}>
          <span style={{ fontSize:11, fontWeight:500, color:'var(--muted-fg)' }}>{label}</span>
          <span style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:26, color: color||'var(--fg)' }}>{value}</span>
          {sub && <span style={{ fontSize:11, color:'var(--muted-fg)' }}>{sub}</span>}
        </div>
      );
    }

    /* ══════════════════════════════════════ APP ══════════════════════════════════════ */
    function App() {
      const [tab,          setTab]          = useState('today');
      const [habits,       setHabits]       = useState(SAMPLE_HABITS);
      const [xp,           setXP]           = useState(47);
      const [showAdd,      setShowAdd]      = useState(false);
      const [celebration,  setCelebration]  = useState(null);
      const [newHabit,     setNewHabit]     = useState({ name:'', icon:'⚡', color:'#7c3aed' });
      const [selectedDay,  setSelectedDay]  = useState(todayStr);
      const [entries,      setEntries]      = useState([{ date:todayStr, mood:4, note:'' }]);
      const [note,         setNote]         = useState('');
      const [mood,         setMood]         = useState(4);

      const weekDates = getWeekDates();
      const last30    = getLast30Days();
      const level     = Math.floor(xp/100)+1;
      const xpInLevel = xp%100;
      const completed = habits.filter(h => h.completedToday).length;
      const total     = habits.length;

      // Stable heat values (seeded by index so they don't re-randomise)
      const heatValues = Array.from({length:30},(_,i)=>[0,1,2,3][(i*7+13)%4]);

      function toggleHabit(id, e) {
        const rect = e.currentTarget.getBoundingClientRect();
        setHabits(prev => prev.map(h => {
          if (h.id !== id) return h;
          const completing = !h.completedToday;
          if (completing) {
            setXP(x => x + h.xpPerCompletion);
            setCelebration({ x: rect.left + rect.width/2, y: rect.top });
            setTimeout(() => setCelebration(null), 800);
          } else {
            setXP(x => Math.max(0, x - h.xpPerCompletion));
          }
          return { ...h, completedToday: completing };
        }));
      }

      function addHabit() {
        if (!newHabit.name.trim()) return;
        setHabits(prev => [...prev, {
          id: Date.now().toString(),
          name: newHabit.name, icon: newHabit.icon, color: newHabit.color,
          streak:0, completedToday:false, frequency:'Daily', xpPerCompletion:10,
        }]);
        setNewHabit({ name:'', icon:'⚡', color:'#7c3aed' });
        setShowAdd(false);
      }

      function saveJournal() {
        setEntries(prev => {
          const i = prev.findIndex(e => e.date === todayStr);
          const entry = { date:todayStr, mood, note };
          if (i>=0) { const n=[...prev]; n[i]=entry; return n; }
          return [...prev, entry];
        });
      }

      const S = {
        root: {
          minHeight:'100vh', display:'flex', flexDirection:'column',
          maxWidth:480, margin:'0 auto', position:'relative',
        },
        header: { padding:'32px 20px 16px', flexShrink:0 },
        nav: { padding:'0 20px 16px', flexShrink:0 },
        main: { flex:1, overflowY:'auto', padding:'0 20px 40px' },
      };

      const tabs = [['today','Today'],['stats','Stats'],['journal','Journal'],['badges','Badges']];

      return (
        <div style={S.root}>
          {celebration && <CelebrationBurst x={celebration.x} y={celebration.y} />}

          {/* ── Header ── */}
          <header style={S.header}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:16 }}>
              <div>
                <p style={{ fontSize:13, fontWeight:500, color:'var(--muted-fg)', marginBottom:2 }}>
                  {today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
                </p>
                <h1 style={{ fontFamily:'var(--font-display)', fontWeight:800, fontSize:26, lineHeight:1.2 }}>
                  {completed===total&&total>0 ? '🎉 Crushed it!' : 'Good morning,'}
                </h1>
                <h1 style={{ fontFamily:'var(--font-display)', fontWeight:800, fontSize:26, lineHeight:1.2, color:'#a3e635' }}>Alex</h1>
              </div>
              <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4 }}>
                <div style={{
                  width:44, height:44, borderRadius:14,
                  background:'linear-gradient(135deg,#7c3aed,#a855f7)',
                  display:'flex', alignItems:'center', justifyContent:'center',
                  fontFamily:'var(--font-display)', fontWeight:700, fontSize:18, color:'#fff',
                }}>A</div>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>{xp} XP</span>
              </div>
            </div>

            <XPBar xp={xpInLevel} level={level} maxXP={100} />

            {/* Progress row */}
            <div style={{
              display:'flex', alignItems:'center', gap:12, marginTop:16, padding:12,
              borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)',
            }}>
              <div style={{ position:'relative', width:48, height:48, flexShrink:0 }}>
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="20" fill="none" stroke="#1e1a2e" strokeWidth="4"/>
                  <circle cx="24" cy="24" r="20" fill="none"
                    stroke={completed===total&&total>0 ? '#a3e635' : '#7c3aed'}
                    strokeWidth="4" strokeLinecap="round"
                    strokeDasharray={2*Math.PI*20}
                    strokeDashoffset={2*Math.PI*20*(1-completed/(total||1))}
                    transform="rotate(-90 24 24)"
                    style={{ transition:'stroke-dashoffset 0.5s ease' }}
                  />
                </svg>
                <span style={{
                  position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center',
                  fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600,
                }}>{completed}/{total}</span>
              </div>
              <div style={{ flex:1 }}>
                <p style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14 }}>Today's Progress</p>
                <p style={{ fontSize:12, marginTop:2, color:'var(--muted-fg)' }}>
                  {completed===0 ? 'Start strong — first habit awaits'
                    : completed===total ? 'All habits complete — legendary!'
                    : `${total-completed} habit${total-completed>1?'s':''} remaining`}
                </p>
              </div>
              <div style={{ textAlign:'right' }}>
                <p style={{ fontFamily:'var(--font-mono)', fontSize:13 }}>🔥</p>
                <p style={{ fontFamily:'var(--font-mono)', fontSize:16, fontWeight:600, color:'#f59e0b' }}>
                  {Math.max(...habits.map(h=>h.streak),0)}d
                </p>
                <p style={{ fontSize:11, color:'var(--muted-fg)' }}>best</p>
              </div>
            </div>
          </header>

          {/* ── Tab Bar ── */}
          <nav style={S.nav}>
            <div style={{ display:'flex', gap:4, padding:4, borderRadius:20, background:'var(--muted)' }}>
              {tabs.map(([id,label]) => (
                <button key={id} onClick={() => setTab(id)} style={{
                  flex:1, padding:'8px 0', borderRadius:14,
                  fontSize:12, fontWeight:600,
                  background: tab===id ? 'var(--primary)' : 'transparent',
                  color: tab===id ? '#fff' : 'var(--muted-fg)',
                  transition:'all 0.2s',
                }}>{label}</button>
              ))}
            </div>
          </nav>

          {/* ── Main ── */}
          <main style={S.main} className="fade-in" key={tab}>

            {/* TODAY */}
            {tab==='today' && (
              <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
                {/* Week strip */}
                <div style={{ display:'flex', gap:6, marginBottom:4 }}>
                  {weekDates.map(d => {
                    const ds = d.toISOString().split('T')[0];
                    const isToday = ds===todayStr;
                    return (
                      <button key={ds} onClick={() => setSelectedDay(ds)} style={{
                        flex:1, display:'flex', flexDirection:'column', alignItems:'center',
                        padding:'8px 0', borderRadius:14, transition:'all 0.2s',
                        background: isToday ? 'var(--primary)' : selectedDay===ds ? 'var(--secondary)' : 'var(--muted)',
                        color: isToday ? '#fff' : selectedDay===ds ? 'var(--fg)' : 'var(--muted-fg)',
                      }}>
                        <span style={{ fontSize:11, fontWeight:500 }}>{d.toLocaleDateString('en-US',{weekday:'short'}).slice(0,1)}</span>
                        <span style={{ fontFamily:'var(--font-mono)', fontSize:14, fontWeight:700 }}>{d.getDate()}</span>
                      </button>
                    );
                  })}
                </div>

                {habits.map(h => <HabitCard key={h.id} habit={h} onToggle={toggleHabit} />)}

                <button onClick={() => setShowAdd(true)} style={{
                  display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                  padding:16, borderRadius:20, border:'2px dashed var(--border)',
                  color:'var(--muted-fg)', fontSize:14, fontWeight:600, transition:'all 0.2s',
                }}>
                  <span style={{ fontSize:18 }}>+</span> Add New Habit
                </button>
              </div>
            )}

            {/* STATS */}
            {tab==='stats' && (
              <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                  <StatCard label="Best Streak" value={`${Math.max(...habits.map(h=>h.streak))}d`} sub="Personal best" color="#f59e0b"/>
                  <StatCard label="Done Today"  value={`${completed}/${total}`} sub="habits" color="#a3e635"/>
                  <StatCard label="Total XP"    value={`${xp}`} sub={`Level ${level}`} color="#7c3aed"/>
                  <StatCard label="Rate"        value={`${Math.round((completed/(total||1))*100)}%`} sub="today" color="#06b6d4"/>
                </div>

                {/* 30-day heatmap */}
                <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                  <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14, color:'var(--muted-fg)', marginBottom:12 }}>30-Day Activity</h3>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(10,1fr)', gap:6 }}>
                    {heatValues.map((heat,i) => {
                      const colors = ['#1e1a2e','rgba(74,29,138,0.35)','rgba(124,58,237,0.55)','#a3e635'];
                      return <div key={i} style={{ aspectRatio:'1', borderRadius:4, backgroundColor:colors[heat] }} />;
                    })}
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:6, marginTop:10, justifyContent:'flex-end' }}>
                    <span style={{ fontSize:11, color:'var(--muted-fg)' }}>Less</span>
                    {['#1e1a2e','rgba(74,29,138,0.35)','rgba(124,58,237,0.55)','#a3e635'].map((c,i)=>(
                      <div key={i} style={{ width:12, height:12, borderRadius:3, backgroundColor:c }}/>
                    ))}
                    <span style={{ fontSize:11, color:'var(--muted-fg)' }}>More</span>
                  </div>
                </div>

                {/* Streak bars */}
                <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                  <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14, color:'var(--muted-fg)', marginBottom:12 }}>Habit Streaks</h3>
                  <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
                    {[...habits].sort((a,b)=>b.streak-a.streak).map(h=>(
                      <div key={h.id} style={{ display:'flex', alignItems:'center', gap:12 }}>
                        <span style={{ fontSize:20, width:32, textAlign:'center' }}>{h.icon}</span>
                        <div style={{ flex:1 }}>
                          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
                            <span style={{ fontSize:13, fontWeight:500 }}>{h.name}</span>
                            <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'#f59e0b' }}>🔥 {h.streak}d</span>
                          </div>
                          <div style={{ height:6, borderRadius:99, background:'#1e1a2e', overflow:'hidden' }}>
                            <div style={{ height:'100%', borderRadius:99, backgroundColor:h.color, width:`${Math.min((h.streak/30)*100,100)}%` }}/>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* JOURNAL */}
            {tab==='journal' && (
              <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
                <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                  <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:16, marginBottom:12 }}>How are you feeling today?</h3>
                  <div style={{ display:'flex', gap:6, marginBottom:16 }}>
                    {MOODS.map(m=>(
                      <button key={m.value} onClick={()=>setMood(m.value)} style={{
                        flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                        padding:'10px 0', borderRadius:14, transition:'all 0.2s',
                        background: mood===m.value ? 'var(--primary)' : 'var(--muted)',
                        transform: mood===m.value ? 'scale(1.08)' : 'scale(1)',
                      }}>
                        <span style={{ fontSize:22 }}>{m.emoji}</span>
                        <span style={{ fontSize:10, fontWeight:600, color: mood===m.value ? '#fff' : 'var(--muted-fg)' }}>{m.label}</span>
                      </button>
                    ))}
                  </div>
                  <textarea
                    value={note}
                    onChange={e=>setNote(e.target.value)}
                    placeholder="What's on your mind today? Reflect on your habits, wins, and challenges..."
                    rows={5}
                    style={{ width:'100%', padding:12, fontSize:14, resize:'none', display:'block', background:'var(--muted)', color:'var(--fg)', border:'1.5px solid var(--border)', borderRadius:14 }}
                  />
                  <button onClick={saveJournal} style={{
                    marginTop:12, width:'100%', padding:'12px 0',
                    borderRadius:14, fontWeight:600, fontSize:14,
                    background:'var(--primary)', color:'#fff', transition:'opacity 0.2s',
                  }}>Save Entry</button>
                </div>

                {entries.filter(e=>e.note).length > 0 && (
                  <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                    <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14, color:'var(--muted-fg)', marginBottom:12 }}>Past Entries</h3>
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      {entries.filter(e=>e.note).slice().reverse().map(e=>(
                        <div key={e.date} style={{ padding:12, borderRadius:14, background:'var(--muted)' }}>
                          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                            <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>{e.date}</span>
                            <span style={{ fontSize:18 }}>{MOODS.find(m=>m.value===e.mood)?.emoji}</span>
                          </div>
                          <p style={{ fontSize:13, lineHeight:1.6 }}>{e.note}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Mood chart */}
                <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                  <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14, color:'var(--muted-fg)', marginBottom:12 }}>Mood Over Time</h3>
                  <div style={{ display:'flex', alignItems:'flex-end', gap:4, height:64 }}>
                    {[4,3,5,4,2,4,5,3,4,4,5,4,3,5].map((v,i)=>(
                      <div key={i} style={{
                        flex:1, borderRadius:'3px 3px 0 0', opacity:0.75,
                        height:`${(v/5)*100}%`,
                        background: v>=4?'#a3e635':v===3?'#7c3aed':'#ef4444',
                      }}/>
                    ))}
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', marginTop:6 }}>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>2 weeks ago</span>
                    <span style={{ fontFamily:'var(--font-mono)', fontSize:11, color:'var(--muted-fg)' }}>Today</span>
                  </div>
                </div>
              </div>
            )}

            {/* BADGES */}
            {tab==='badges' && (
              <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  <h3 style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:16 }}>Achievements</h3>
                  <span style={{ fontFamily:'var(--font-mono)', fontSize:12, padding:'4px 10px', borderRadius:10, background:'var(--secondary)', color:'var(--accent)' }}>
                    {BADGE_DEFS.filter(b=>b.earned).length}/{BADGE_DEFS.length}
                  </span>
                </div>

                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
                  {BADGE_DEFS.map(b=>(
                    <div key={b.id} style={{
                      padding:16, borderRadius:20, display:'flex', flexDirection:'column', alignItems:'center', gap:8, textAlign:'center',
                      border: `1.5px solid ${b.earned ? 'rgba(163,230,53,0.3)' : 'var(--border)'}`,
                      background: b.earned ? '#0d1a00' : 'var(--card)',
                      opacity: b.earned ? 1 : 0.5,
                    }}>
                      <span style={{ fontSize:32 }}>{b.icon}</span>
                      <div>
                        <p style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:13 }}>{b.name}</p>
                        <p style={{ fontSize:11, marginTop:2, color:'var(--muted-fg)' }}>{b.desc}</p>
                      </div>
                      {b.earned
                        ? <span style={{ fontSize:11, fontWeight:700, padding:'2px 10px', borderRadius:99, background:'rgba(163,230,53,0.12)', color:'#a3e635' }}>Earned ✓</span>
                        : <span style={{ fontSize:11, color:'var(--muted-fg)' }}>Locked</span>
                      }
                    </div>
                  ))}
                </div>

                {/* Leaderboard */}
                <div style={{ padding:16, borderRadius:20, border:'1.5px solid var(--border)', background:'var(--card)' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                    <h3 style={{ fontFamily:'var(--font-display)', fontWeight:600, fontSize:14 }}>Weekly League</h3>
                    <span style={{ fontSize:11, fontWeight:600, padding:'3px 8px', borderRadius:99, background:'rgba(124,58,237,0.15)', color:'#a78bfa' }}>Public</span>
                  </div>
                  {[
                    { name:'Jordan M.',  xp:312, streak:22, you:false },
                    { name:'Alex (You)', xp:287, streak:15, you:true  },
                    { name:'Sam T.',     xp:241, streak:11, you:false },
                    { name:'Riley K.',   xp:198, streak:8,  you:false },
                    { name:'Morgan L.', xp:145, streak:5,  you:false },
                  ].map((p,i)=>(
                    <div key={p.name} style={{
                      display:'flex', alignItems:'center', gap:12, padding:'10px 0',
                      borderBottom: i<4 ? '1px solid var(--border)' : 'none',
                    }}>
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:14, width:20, textAlign:'center', color: i===0?'#f59e0b':'var(--muted-fg)' }}>
                        {i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}
                      </span>
                      <span style={{ flex:1, fontSize:14, fontWeight:500, color: p.you?'#a3e635':'var(--fg)' }}>{p.name}</span>
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'#f59e0b' }}>🔥{p.streak}</span>
                      <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--muted-fg)' }}>{p.xp}xp</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ── Add Habit Modal ── */}
          {showAdd && (
            <div
              onClick={e => e.target===e.currentTarget && setShowAdd(false)}
              style={{
                position:'fixed', inset:0, zIndex:40,
                display:'flex', alignItems:'flex-end',
                background:'rgba(0,0,0,0.7)', backdropFilter:'blur(4px)',
              }}
            >
              <div style={{ width:'100%', maxWidth:480, margin:'0 auto' }} className="slide-up">
                <div style={{ borderRadius:'24px 24px 0 0', padding:24, background:'var(--card)', border:'1px solid var(--border)' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
                    <h2 style={{ fontFamily:'var(--font-display)', fontWeight:700, fontSize:20 }}>New Habit</h2>
                    <button onClick={()=>setShowAdd(false)} style={{ width:32, height:32, borderRadius:12, color:'var(--muted-fg)', fontSize:16, display:'flex', alignItems:'center', justifyContent:'center' }}>✕</button>
                  </div>

                  <input
                    type="text"
                    placeholder="Habit name..."
                    value={newHabit.name}
                    onChange={e=>setNewHabit(n=>({...n,name:e.target.value}))}
                    onKeyDown={e=>e.key==='Enter'&&addHabit()}
                    autoFocus
                    style={{ width:'100%', padding:12, fontSize:15, fontWeight:500, marginBottom:16, display:'block', background:'var(--muted)', color:'var(--fg)', border:'1.5px solid var(--border)', borderRadius:14 }}
                  />

                  <p style={{ fontSize:11, fontWeight:600, color:'var(--muted-fg)', marginBottom:8, letterSpacing:'0.08em' }}>ICON</p>
                  <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:16 }}>
                    {ICONS.map(ic=>(
                      <button key={ic} onClick={()=>setNewHabit(n=>({...n,icon:ic}))} style={{
                        width:40, height:40, borderRadius:12, fontSize:20,
                        display:'flex', alignItems:'center', justifyContent:'center',
                        background: newHabit.icon===ic ? 'var(--primary)' : 'var(--muted)',
                        transform: newHabit.icon===ic ? 'scale(1.15)' : 'scale(1)',
                        transition:'all 0.15s',
                      }}>{ic}</button>
                    ))}
                  </div>

                  <p style={{ fontSize:11, fontWeight:600, color:'var(--muted-fg)', marginBottom:8, letterSpacing:'0.08em' }}>COLOR</p>
                  <div style={{ display:'flex', gap:8, marginBottom:20 }}>
                    {COLORS.map(c=>(
                      <button key={c} onClick={()=>setNewHabit(n=>({...n,color:c}))} style={{
                        width:32, height:32, borderRadius:'50%', backgroundColor:c, flexShrink:0,
                        outline: newHabit.color===c ? `2.5px solid ${c}` : 'none',
                        outlineOffset: 3,
                        transform: newHabit.color===c ? 'scale(1.25)' : 'scale(1)',
                        transition:'all 0.15s',
                      }}/>
                    ))}
                  </div>

                  <button onClick={addHabit} style={{
                    width:'100%', padding:'14px 0', borderRadius:14,
                    fontWeight:700, fontSize:15, background:'var(--primary)', color:'#fff', transition:'opacity 0.2s',
                  }}>Create Habit</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Habit Tracker</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 70px;
    }

    header {
      padding: 24px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-greeting h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .user-greeting p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    main {
      padding: 20px;
      flex: 1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background-color: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--surface-light);
      background-color: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button.btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    button.btn:hover {
      opacity: 0.9;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background-color: var(--surface);
      border-top: 1px solid var(--surface-light);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    .modal h2 {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="user-greeting">
        <h1 id="greetingText">Hi, User</h1>
        <p>Keep up the great work today!</p>
      </div>
    </header>

    <main>
      <!-- Dashboard View -->
      <section id="dashboard" class="tab-content active">
        <div class="card">
          <h3>Today's Progress</h3>
          <p style="color: var(--text-muted); margin-top: 8px;">Select or add new habits to start tracking.</p>
        </div>
      </section>

      <!-- Habits View -->
      <section id="habits" class="tab-content">
        <div class="card">
          <h3>Your Habits</h3>
          <p style="color: var(--text-muted); margin-top: 8px;">No habits added yet.</p>
        </div>
      </section>

      <!-- Analytics View -->
      <section id="analytics" class="tab-content">
        <div class="card">
          <h3>Analytics</h3>
          <p style="color: var(--text-muted); margin-top: 8px;">Your progress charts will appear here.</p>
        </div>
      </section>

      <!-- Settings View -->
      <section id="settings" class="tab-content">
        <div class="card">
          <h3>User Profile</h3>
          <div class="form-group" style="margin-top: 16px;">
            <label for="usernameInput">Your Name</label>
            <input type="text" id="usernameInput" placeholder="Enter your name" />
          </div>
          <button class="btn" onclick="saveNameFromSettings()">Save Name</button>
        </div>
      </section>
    </main>

    <!-- Navigation -->
    <nav>
      <button class="nav-btn active" onclick="switchTab('dashboard', this)">Dashboard</button>
      <button class="nav-btn" onclick="switchTab('habits', this)">Habits</button>
      <button class="nav-btn" onclick="switchTab('analytics', this)">Analytics</button>
      <button class="nav-btn" onclick="switchTab('settings', this)">Settings</button>
    </nav>
  </div>

  <!-- First-time User Prompt Modal -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal">
      <h2>Welcome!</h2>
      <p style="color: var(--text-muted); margin-bottom: 16px;">What should we call you?</p>
      <div class="form-group">
        <input type="text" id="modalNameInput" placeholder="Enter your name" />
      </div>
      <button class="btn" onclick="saveNameFromModal()">Get Started</button>
    </div>
  </div>

  <script>
    // Initialize user name on load
    document.addEventListener("DOMContentLoaded", () => {
      const savedName = localStorage.getItem("tracker_username");
      if (savedName) {
        updateGreeting(savedName);
        document.getElementById("usernameInput").value = savedName;
      } else {
        // Show modal for first-time visitors
        document.getElementById("nameModal").classList.add("active");
      }
    });

    function updateGreeting(name) {
      const greetingElement = document.getElementById("greetingText");
      greetingElement.textContent = `Hi, ${name}`;
    }

    function saveNameFromModal() {
      const inputVal = document.getElementById("modalNameInput").value.trim();
      const nameToSave = inputVal ? inputVal : "User";
      
      localStorage.setItem("tracker_username", nameToSave);
      updateGreeting(nameToSave);
      document.getElementById("usernameInput").value = nameToSave;
      
      document.getElementById("nameModal").classList.remove("active");
    }

    function saveNameFromSettings() {
      const inputVal = document.getElementById("usernameInput").value.trim();
      const nameToSave = inputVal ? inputVal : "User";

      localStorage.setItem("tracker_username", nameToSave);
      updateGreeting(nameToSave);
      alert("Name updated successfully!");
    }

    function switchTab(tabId, element) {
      document.querySelectorAll(".tab-content").forEach(tab => {
        tab.classList.remove("active");
      });
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      document.getElementById(tabId).classList.add("active");
      element.classList.add("active");
    }
  </script>
</body>
</html>

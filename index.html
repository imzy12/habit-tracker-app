<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f8;
      margin: 0;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    body.dark { background: #1c1c1e; color: #f0f0f0; }

    /* Onboarding screen */
    #onboarding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 30px;
    }
    #onboarding .emoji { font-size: 60px; margin-bottom: 10px; }
    #onboarding h1 { font-size: 24px; margin-bottom: 6px; }
    #onboarding p { color: #666; max-width: 300px; margin-bottom: 30px; }
    body.dark #onboarding p { color: #aaa; }
    #getStartedBtn {
      padding: 14px 28px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    /* App shell */
    #app { display: none; padding: 30px 16px 90px 16px; max-width: 400px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .top-bar h2 { font-size: 20px; margin: 0; }

    .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
    #habitInput {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }
    body.dark #habitInput { background: #2c2c2e; color: white; border-color: #555; }
    #addBtn {
      padding: 12px 16px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #habitList { list-style: none; padding: 0; margin: 0; }
    #habitList li {
      background: white;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 15px;
    }
    body.dark #habitList li { background: #2c2c2e; }

    .habit-top { display: flex; justify-content: space-between; align-items: center; }
    .habit-actions { display: flex; gap: 6px; }
    .doneBtn, .deleteBtn {
      padding: 6px 10px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; color: white;
    }
    .doneBtn { background: #ff9f43; }
    .doneBtn:disabled { background: #ccc; cursor: not-allowed; }
    .deleteBtn { background: #e55039; }

    .empty { color: #888; font-size: 14px; margin-top: 20px; text-align: center; }

    /* Stats page */
    .stat-habit { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    body.dark .stat-habit { background: #2c2c2e; }
    .stat-habit .name { font-weight: 600; margin-bottom: 8px; }
    .week-row { display: flex; gap: 6px; justify-content: space-between; }
    .day-dot { flex: 1; text-align: center; font-size: 11px; }
    .day-dot .circle { width: 20px; height: 20px; margin: 2px auto; border-radius: 50%; background: #e0e0e0; }
    body.dark .day-dot .circle { background: #444; }
    .day-dot .circle.done { background: #4caf50; }

    /* Settings page */
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      background: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); font-size: 14px;
    }
    body.dark .setting-row { background: #2c2c2e; }
    .setting-row button, .setting-row input {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px;
    }
    #themeToggle { border: none; background: #4a90e2; color: white; cursor: pointer; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; display: flex; justify-content: space-around;
      padding: 10px 0; box-shadow: 0 -1px 6px rgba(0,0,0,0.1);
    }
    body.dark .bottom-nav { background: #2c2c2e; }
    .nav-btn {
      background: none; border: none; font-size: 12px; color: #888;
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .nav-btn .icon { font-size: 20px; }
    .nav-btn.active { color: #4a90e2; }
  </style>
</head>
<body>

  <!-- Onboarding screen -->
  <div id="onboarding">
    <div class="emoji">🔥</div>
    <h1>Welcome to Habit Tracker</h1>
    <p>Build daily streaks, track your progress, and stay consistent — all saved right on your device.</p>
    <button id="getStartedBtn">Get Started</button>
  </div>

  <!-- Main app -->
  <div id="app">

    <div class="page active" id="page-home">
      <div class="top-bar"><h2>🔥 My Habits</h2></div>
      <div class="input-row">
        <input type="text" id="habitInput" placeholder="Enter a habit">
        <button id="addBtn">Add</button>
      </div>
      <ul id="habitList"></ul>
      <p class="empty" id="emptyMsg">No habits yet — add one to get started!</p>
    </div>

    <div class="page" id="page-stats">
      <div class="top-bar"><h2>📊 Stats</h2></div>
      <div id="statsList"></div>
    </div>

    <div class="page" id="page-settings">
      <div class="top-bar"><h2>⚙️ Settings</h2></div>
      <div class="setting-row">
        <span>Dark mode</span>
        <button id="themeToggle">🌙 Toggle</button>
      </div>
      <div class="setting-row">
        <span>Daily reminder</span>
        <input type="time" id="reminderTime">
      </div>
      <div class="setting-row">
        <span>Enable notifications</span>
        <button id="enableNotif">Enable</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home"><span class="icon">🏠</span>Home</button>
      <button class="nav-btn" data-page="stats"><span class="icon">📊</span>Stats</button>
      <button class="nav-btn" data-page="settings"><span class="icon">⚙️</span>Settings</button>
    </nav>
  </div>

  <script>
    let habits = JSON.parse(localStorage.getItem("habits")) || [];
    habits.forEach(h => { if (!h.history) h.history = []; });

    function todayString() { return new Date().toISOString().split("T")[0]; }
    function last7Days() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d.toISOString().split("T")[0]);
      }
      return days;
    }
    const dayLabels = ["S","M","T","W","T","F","S"];

    // Onboarding logic
    const onboarding = document.getElementById("onboarding");
    const app = document.getElementById("app");
    if (localStorage.getItem("onboarded") === "true") {
      onboarding.style.display = "none";
      app.style.display = "block";
    }
    document.getElementById("getStartedBtn").addEventListener("click", function() {
      localStorage.setItem("onboarded", "true");
      onboarding.style.display = "none";
      app.style.display = "block";
    });

    // Navigation logic
    document.querySelectorAll(".nav-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("page-" + btn.dataset.page).classList.add("active");
        if (btn.dataset.page === "stats") renderStats();
      });
    });

    // Theme
    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
    themeToggle.addEventListener("click", function() {
      document.body.classList.toggle("dark");
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    });

    // Reminders
    const reminderInput = document.getElementById("reminderTime");
    const savedTime = localStorage.getItem("reminderTime");
    if (savedTime) reminderInput.value = savedTime;
    reminderInput.addEventListener("change", function() {
      localStorage.setItem("reminderTime", reminderInput.value);
    });
    document.getElementById("enableNotif").addEventListener("click", function() {
      if (!("Notification" in window)) { alert("Not supported in this browser."); return; }
      Notification.requestPermission().then(function(p) {
        if (p === "granted") alert("Reminders enabled! Keep a tab open around your reminder time.");
      });
    });
    setInterval(function() {
      const time = localStorage.getItem("reminderTime");
      if (!time || Notification.permission !== "granted") return;
      const now = new Date();
      const currentTime = now.toTimeString().slice(0,5);
      const alreadyNotified = localStorage.getItem("notifiedDate") === todayString();
      if (currentTime === time && !alreadyNotified) {
        const undone = habits.filter(h => h.lastDone !== todayString());
        if (undone.length > 0) {
          new Notification("Habit Tracker", { body: undone.length + " habit(s) still to do today!" });
        }
        localStorage.setItem("notifiedDate", todayString());
      }
    }, 30000);

    // Habits (Home page)
    document.getElementById("addBtn").addEventListener("click", function() {
      const input = document.getElementById("habitInput");
      const name = input.value.trim();
      if (name !== "") {
        habits.push({ name: name, streak: 0, lastDone: null, history: [] });
        input.value = "";
        saveAndRender();
      }
    });

    function saveAndRender() {
      localStorage.setItem("habits", JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const list = document.getElementById("habitList");
      const emptyMsg = document.getElementById("emptyMsg");
      list.innerHTML = "";
      emptyMsg.style.display = habits.length === 0 ? "block" : "none";
      const today = todayString();

      habits.forEach(function(habit, index) {
        if (habit.lastDone) {
          const diff = Math.floor((new Date(today) - new Date(habit.lastDone)) / 86400000);
          if (diff > 1) habit.streak = 0;
        }
        const li = document.createElement("li");
        const top = document.createElement("div");
        top.className = "habit-top";
        const text = document.createElement("span");
        text.textContent = habit.name + " — 🔥 " + habit.streak;
        const actions = document.createElement("div");
        actions.className = "habit-actions";
        const doneBtn = document.createElement("button");
        doneBtn.textContent = habit.lastDone === today ? "Done ✓" : "Done today";
        doneBtn.className = "doneBtn";
        doneBtn.disabled = habit.lastDone === today;
        doneBtn.addEventListener("click", function() {
          habit.streak++;
          habit.lastDone = today;
          if (!habit.history.includes(today)) habit.history.push(today);
          saveAndRender();
        });
        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "deleteBtn";
        deleteBtn.addEventListener("click", function() {
          habits.splice(index, 1);
          saveAndRender();
        });
        actions.appendChild(doneBtn);
        actions.appendChild(deleteBtn);
        top.appendChild(text);
        top.appendChild(actions);
        li.appendChild(top);
        list.appendChild(li);
      });
      localStorage.setItem("habits", JSON.stringify(habits));
    }

    // Stats page
    function renderStats() {
      const container = document.getElementById("statsList");
      container.innerHTML = "";
      if (habits.length === 0) {
        container.innerHTML = "<p class='empty'>Add habits on the Home tab to see stats here.</p>";
        return;
      }
      const week = last7Days();
      habits.forEach(function(habit) {
        const card = document.createElement("div");
        card.className = "stat-habit";
        const name = document.createElement("div");
        name.className = "name";
        name.textContent = habit.name + " — 🔥 " + habit.streak + " day streak";
        const weekRow = document.createElement("div");
        weekRow.className = "week-row";
        week.forEach(function(dateStr) {
          const dayDiv = document.createElement("div");
          dayDiv.className = "day-dot";
          const label = document.createElement("div");
          label.textContent = dayLabels[new Date(dateStr).getDay()];
          const circle = document.createElement("div");
          circle.className = "circle" + (habit.history.includes(dateStr) ? " done" : "");
          dayDiv.appendChild(label);
          dayDiv.appendChild(circle);
          weekRow.appendChild(dayDiv);
        });
        card.appendChild(name);
        card.appendChild(weekRow);
        container.appendChild(card);
      });
    }

    renderHabits();
  </script>
</body>
</html>

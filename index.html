<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Habit Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #f0f6fc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background-color: #161b22;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 80px;
    }

    header {
      padding: 24px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .greeting-container h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .greeting-container p {
      color: #8b949e;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .add-btn {
      background-color: #238636;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      padding: 20px;
      flex: 1;
    }

    .habit-card {
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .habit-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .habit-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      background-color: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
    }

    .nav-item {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .nav-item.active {
      color: #58a6ff;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: white;
    }

    .save-btn {
      width: 100%;
      padding: 10px;
      background: #238636;
      border: none;
      color: white;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="greeting-container">
        <h1>Hi, <span id="userName">Alex</span></h1>
        <p>Keep up the great work!</p>
      </div>
      <button class="add-btn" onclick="openHabitModal()">+</button>
    </header>

    <main>
      <div class="habit-card">
        <div class="habit-info">
          <div class="habit-icon" style="background-color: rgba(225, 29, 72, 0.2); color: #f43f5e;">🔥</div>
          <div>
            <h4>Morning Workout</h4>
            <p style="font-size: 0.8rem; color: #8b949e;">Daily target</p>
          </div>
        </div>
      </div>
    </main>

    <nav>
      <button class="nav-item active">Dashboard</button>
      <button class="nav-item">Habits</button>
      <button class="nav-item">Analytics</button>
      <button class="nav-item">Settings</button>
    </nav>
  </div>

  <!-- Habit Modal -->
  <div class="modal" id="habitModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>New Habit</h3>
        <button onclick="closeHabitModal()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
      </div>
      <div class="field">
        <label>ICON</label>
        <input type="text" placeholder="🔥">
      </div>
      <div class="field">
        <label>COLOR</label>
        <input type="text" placeholder="#f43f5e">
      </div>
      <button class="save-btn" onclick="closeHabitModal()">Add Habit</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check if a user name is saved in local storage
      let savedName = localStorage.getItem("custom_user_name");

      // Prompt if no name has been entered yet
      if (!savedName) {
        savedName = prompt("Welcome! What is your name?");
        if (!savedName || savedName.trim() === "") {
          savedName = "Friend";
        } else {
          savedName = savedName.trim();
        }
        localStorage.setItem("custom_user_name", savedName);
      }

      // Dynamically update the user name target element
      const userNameTarget = document.getElementById("userName");
      if (userNameTarget) {
        userNameTarget.textContent = savedName;
      }
    });

    function openHabitModal() {
      document.getElementById("habitModal").classList.add("active");
    }

    function closeHabitModal() {
      document.getElementById("habitModal").classList.remove("active");
    }
  </script>
</body>
</html>

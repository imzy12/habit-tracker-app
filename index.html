<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      margin: 0;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    body.dark { background: #1c1c1e; color: #f0f0f0; }

    h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }

    #themeToggle {
      border: none;
      background: #ddd;
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    body.dark #themeToggle { background: #444; color: white; }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 360px;
    }

    #habitInput {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    body.dark #habitInput { background: #2c2c2e; color: white; border-color: #555; }

    #addBtn {
      padding: 12px 16px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    #addBtn:hover { background: #3a7bc8; }

    #habitList {
      list-style: none;
      padding: 0;
      width: 100%;
      max-width: 360px;
    }

    #habitList li {
      background: white;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 15px;
    }

    body.dark #habitList li { background: #2c2c2e; }

    .habit-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .habit-actions { display: flex; gap: 6px; }

    .doneBtn, .deleteBtn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      color: white;
    }

    .doneBtn { background: #ff9f43; }
    .doneBtn:hover { background: #e68a2e; }
    .doneBtn:disabled { background: #ccc; cursor: not-allowed; }

    .deleteBtn { background: #e55039; }
    .deleteBtn:hover { background: #c9432b; }

    .week-row {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }

    .day-dot {
      flex: 1;
      text-align: center;
      font-size: 11px;
    }

    .day-dot .circle {
      width: 20px;
      height: 20px;
      margin: 2px auto;
      border-radius: 50%;
      background: #e0e0e0;
    }

    body.dark .day-dot .circle { background: #444; }

    .day-dot .circle.done { background: #4caf50; }

    .empty {
      color: #888;
      font-size: 14px;
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🔥 My Habit Tracker <button id="themeToggle">🌙 Dark</button></h1>

  <div class="input-row">
    <input type="text" id="habitInput" placeholder="Enter a habit">
    <button id="addBtn">Add</button>
  </div>

  <ul id="habitList"></ul>
  <p class="empty" id="emptyMsg">No habits yet — add one to get started!</p>

  <script>
    let habits = JSON.parse(localStorage.getItem("habits")) || [];

    // Make sure older saved habits still have a history array
    habits.forEach(h => { if (!h.history) h.history = []; });

    function todayString() {
      return new Date().toISOString().split("T")[0];
    }

    function last7Days() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d.toISOString().split("T")[0]);
      }
      return days;
    }

    const dayLabels = ["S", "M", "T", "W", "T", "F", "S"];

    const themeToggle = document.getElementById("themeToggle");
    if (localStorage.getItem("darkMode") === "true") {
      document.body.classList.add("dark");
      themeToggle.textContent = "☀️ Light";
    }

    themeToggle.addEventListener("click", function() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      localStorage.setItem("darkMode", isDark);
      themeToggle.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    });

    document.getElementById("addBtn").addEventListener("click", function() {
      const input = document.getElementById("habitInput");
      const habitName = input.value.trim();

      if (habitName !== "") {
        habits.push({ name: habitName, streak: 0, lastDone: null, history: [] });
        input.value = "";
        saveAndRender();
      }
    });

    function saveAndRender() {
      localStorage.setItem("habits", JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const list = document.getElementById("habitList");
      const emptyMsg = document.getElementById("emptyMsg");
      list.innerHTML = "";

      emptyMsg.style.display = habits.length === 0 ? "block" : "none";

      const today = todayString();
      const week = last7Days();

      habits.forEach(function(habit, index) {
        if (habit.lastDone) {
          const last = new Date(habit.lastDone);
          const diffDays = Math.floor((new Date(today) - last) / (1000 * 60 * 60 * 24));
          if (diffDays > 1) habit.streak = 0;
        }

        const li = document.createElement("li");

        const top = document.createElement("div");
        top.className = "habit-top";

        const text = document.createElement("span");
        text.textContent = habit.name + " — 🔥 " + habit.streak;

        const actions = document.createElement("div");
        actions.className = "habit-actions";

        const doneBtn = document.createElement("button");
        doneBtn.textContent = habit.lastDone === today ? "Done ✓" : "Done today";
        doneBtn.className = "doneBtn";
        doneBtn.disabled = habit.lastDone === today;
        doneBtn.addEventListener("click", function() {
          habit.streak++;
          habit.lastDone = today;
          if (!habit.history.includes(today)) habit.history.push(today);
          saveAndRender();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.className = "deleteBtn";
        deleteBtn.addEventListener("click", function() {
          habits.splice(index, 1);
          saveAndRender();
        });

        actions.appendChild(doneBtn);
        actions.appendChild(deleteBtn);
        top.appendChild(text);
        top.appendChild(actions);

        const weekRow = document.createElement("div");
        weekRow.className = "week-row";

        week.forEach(function(dateStr, i) {
          const dayDiv = document.createElement("div");
          dayDiv.className = "day-dot";

          const label = document.createElement("div");
          label.textContent = dayLabels[new Date(dateStr).getDay()];

          const circle = document.createElement("div");
          circle.className = "circle" + (habit.history.includes(dateStr) ? " done" : "");

          dayDiv.appendChild(label);
          dayDiv.appendChild(circle);
          weekRow.appendChild(dayDiv);
        });

        li.appendChild(top);
        li.appendChild(weekRow);
        list.appendChild(li);
      });

      localStorage.setItem("habits", JSON.stringify(habits));
    }

    renderHabits();
  </script>
</body>
</html>

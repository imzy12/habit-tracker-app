<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Needed for the Leagues feature (free Firebase Firestore) — see FIREBASE_CONFIG near the top of the <script> below -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #14120F;
      --surface: #1E1B17;
      --surface-2: #262219;
      --line: #322D25;
      --text: #F3EFE8;
      --text-muted: #948C7E;
      --flame-1: #FF7A45;
      --flame-2: #E63946;
      --amber: #FFC857;
      --flame-grad: linear-gradient(135deg, var(--flame-1), var(--flame-2));
    }
    body.light {
      --bg: #FAF8F4;
      --surface: #FFFFFF;
      --surface-2: #F1EDE5;
      --line: #E7E1D6;
      --text: #211D17;
      --text-muted: #85796A;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
    }

    h1, h2, h3, .num-font { font-family: 'Space Grotesk', sans-serif; }

    #onboarding { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 30px; }
    .onboard-step { display: none; flex-direction: column; align-items: center; width: 100%; }
    .onboard-step.active { display: flex; }
    #onboarding .emoji { font-size: 56px; margin-bottom: 14px; }
    #onboarding h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; }
    #onboarding p { color: var(--text-muted); max-width: 300px; margin-bottom: 32px; line-height: 1.5; }
    .onboard-btn {
      padding: 14px 32px; border: none; background: var(--flame-grad); color: white;
      border-radius: 100px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .onboard-btn:active { transform: scale(0.97); }
    .onboard-options { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
    .onboard-option {
      padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; text-align: left;
    }
    .onboard-option.selected { border-color: var(--flame-1); background: var(--surface-2); box-shadow: 0 0 0 1px var(--flame-1) inset; }
    .dashboard-greeting { font-size: 15px; font-weight: 600; color: var(--text); padding-top: 4px; }
    .mood-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 24px; text-align: center; }
    .mood-question { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; }
    .mood-options { display: flex; justify-content: center; gap: 10px; }
    .mood-btn {
      font-size: 24px; background: var(--surface-2); border: 2px solid transparent; border-radius: 50%;
      width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      padding: 0; font-family: 'Inter', sans-serif;
    }
    .mood-btn.selected { border-color: var(--flame-1); background: var(--surface); }
    .mood-cell {
      width: 20px; height: 20px; margin: 3px auto; border-radius: 6px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; font-size: 13px; cursor: pointer;
    }

    #app { display: none; padding: 24px 18px 100px 18px; max-width: 420px; margin: 0 auto; }
    .page { display: none; }
    .page.active { display: block; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .top-bar h2 { font-size: 15px; margin: 0; color: var(--text-muted); font-weight: 500; letter-spacing: 0.3px; }
    .back-btn { border: none; background: none; font-size: 15px; cursor: pointer; color: var(--text); font-family: 'Inter', sans-serif; padding: 4px 0; }

    .hero { text-align: center; padding: 10px 0 20px 0; }
    .hero .hero-num {
      font-size: 60px; font-weight: 700; line-height: 1;
      background: var(--flame-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero .hero-label { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

    /* Level card */
    .level-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 18px; margin-bottom: 24px;
    }
    .level-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .level-left { display: flex; align-items: center; gap: 10px; }
    .level-badge {
      width: 40px; height: 40px; border-radius: 50%; background: var(--flame-grad);
      display: flex; align-items: center; justify-content: center; font-weight: 700; color: white;
      font-family: 'Space Grotesk', sans-serif; font-size: 15px; flex-shrink: 0;
    }
    .level-name { font-weight: 600; font-size: 14px; }
    .level-title { font-size: 11px; color: var(--text-muted); }
    .level-xp-text { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .level-progress-track { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
    .level-progress-fill { height: 100%; background: var(--flame-grad); border-radius: 6px; transition: width 0.3s; }

    .add-habit-btn {
      width: 100%; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
      background: var(--surface); color: var(--text); margin-bottom: 24px;
    }
    .add-habit-btn:active { transform: scale(0.98); }

    #habitList { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    #habitList li {
      background: var(--surface); padding: 16px 14px; border-bottom: 1px solid var(--line);
      border-left: 3px solid var(--line); font-size: 15px; cursor: pointer; transition: border-color 0.2s;
    }
    #habitList li.tier-1 { border-left-color: var(--amber); }
    #habitList li.tier-2 { border-left-color: var(--flame-1); }
    #habitList li.tier-3 { border-left-color: var(--flame-2); }

    .habit-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .habit-name { font-weight: 500; }
    .habit-streak { color: var(--text-muted); font-size: 13px; margin-left: 6px; font-family: 'Space Grotesk', sans-serif; }
    .habit-actions { display: flex; gap: 4px; align-items: center; }
    .habit-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .meta-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .icon-btn {
      border: none; background: none; cursor: pointer; font-size: 15px; padding: 8px;
      border-radius: 8px; color: var(--text-muted); line-height: 1;
    }
    .icon-btn:active { background: var(--surface-2); }

    .primaryBtn {
      border: none; padding: 8px 14px; border-radius: 100px; font-size: 13px; font-weight: 600;
      background: var(--flame-grad); color: white; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .primaryBtn:disabled { background: var(--surface-2); color: var(--text-muted); }
    .primaryBtn:active { transform: scale(0.96); }

    .empty { color: var(--text-muted); font-size: 14px; margin-top: 24px; text-align: center; }

    .stat-habit { background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 10px; border: 1px solid var(--line); }
    .stat-habit .name { font-weight: 500; margin-bottom: 10px; font-size: 14px; }
